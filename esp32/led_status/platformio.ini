[env:esp32s3]
; 用本机已装好的 6.8.1（Arduino-ESP32 2.0.17），避免联网拉新版工具链
platform = espressif32@6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM6
monitor_port = COM6
board_build.flash_size = 16MB
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
